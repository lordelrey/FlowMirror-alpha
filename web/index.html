<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowMirror 模拟社会回放</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>FlowMirror <span class="dim">模拟社会回放</span></h1>
    <span class="runtag" id="runtag">未选择运行</span>
    <span class="spacer"></span>
    <span class="chips">
      <span class="chip" id="chip-stepwrap" hidden><span id="stepchip"></span></span>
      <span class="chip" id="chip-source" hidden></span>
      <span class="chip" id="chip-policy" hidden></span>
      <span class="chip" id="chip-scale" hidden></span>
      <span class="chip warn" id="chip-nav" hidden>合成净值，仅供演示</span>
      <span class="chip warn" id="chip-mock" hidden>模拟模型，无真实调用</span>
      <span class="chip warn" id="chip-img" hidden></span>
      <span class="chip" id="chip-inv" hidden></span>
    </span>
  </header>

  <nav class="topnav" id="topnav" aria-label="页面">
    <a href="#/">首页</a>
    <a href="#/run">配置与运行</a>
    <a href="#/replay">回放</a>
    <a href="#/agent">投资者</a>
    <a href="#/modality">模态对照</a>
    <a href="#/audit">审计</a>
    <a href="#/data">数据与场景</a>
  </nav>

  <div id="loading" class="empty">正在载入运行数据…</div>

  <div id="fatal" class="err" hidden>
    <h2>无法载入运行数据</h2>
    <p id="fatal-msg" class="muted"></p>
    <p class="muted">在仓库根目录启动一个静态服务后打开本页：</p>
    <pre>python -m http.server 8765 --bind 127.0.0.1</pre>
    <p class="muted">然后访问 <code>http://127.0.0.1:8765/web/?run=&lt;运行标签&gt;</code>，
      或用带 API 的本地小服务：</p>
    <pre>python web/server.py</pre>
    <p class="muted">运行标签就是 <code>runs/out/</code> 下的目录名。</p>
  </div>

  <section id="page-home" class="page" hidden></section>
  <section id="page-run" class="page" hidden></section>
  <section id="page-replay" class="page" hidden></section>
  <section id="page-agent" class="page" hidden></section>
  <section id="page-modality" class="page" hidden></section>
  <section id="page-audit" class="page" hidden></section>
  <section id="page-data" class="page" hidden></section>

</div>
<script type="module" src="app.js"></script>
</body>
</html>
