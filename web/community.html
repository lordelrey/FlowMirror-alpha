<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLOWMIRROR · 社会观察室</title>
<style>
  :root {
    --coral: #ed4d62;
    --coral-dark: #d13a4e;
    --coral-soft: #fdeef0;
    --bg: #faf9f7;
    --warm-white: #fffefc;
    --card: #ffffff;
    --text: #3d3a38;
    --text-muted: #8a8580;
    --line: #ece8e4;
    --radius: 14px;
    --radius-sm: 9px;
    --sidebar-w: 200px;
    --right-w: 320px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.55;
  }

  /* ---------- top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 20px;
    background: var(--warm-white);
    border-bottom: 1px solid var(--line);
  }
  .topbar .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .topbar .brand .logo {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: .5px;
    color: var(--text);
  }
  .topbar .brand .logo b { color: var(--coral); }
  .topbar .brand .sub {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  #agent-search-panel input { box-sizing: border-box; width: 100%; padding: 8px;
    border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  #agent-search-count { display: block; margin-top: 6px; font-size: 12px; color: var(--text-muted); }

  .topbar .spacer { flex: 1; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .toolbar label {
    font-size: 12px;
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .toolbar select, .toolbar input[type="date"], .toolbar input[type="text"] {
    font: inherit;
    font-size: 13px;
    padding: 5px 8px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: #fff;
    color: var(--text);
  }
  .toolbar select:focus-visible, .toolbar button:focus-visible,
  .toolbar input:focus-visible {
    outline: 2px solid var(--coral);
    outline-offset: 1px;
  }

  button {
    font: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    background: var(--coral);
    color: #fff;
    transition: background .15s;
  }
  .btn:hover { background: var(--coral-dark); }
  .btn.ghost {
    background: #fff;
    color: var(--text);
    border: 1px solid var(--line);
  }
  .btn.ghost:hover { border-color: var(--coral); color: var(--coral); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 22px;
    font-size: 13px;
    min-width: 0;
    max-width: 100%;
  }
  #status { min-width: 0; overflow-wrap: anywhere; }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #9aa79b;
    flex: none;
  }
  #status.error { color: #b3261e; font-weight: 600; }
  #status.error + .status-dot, .status-bar.has-error .status-dot { background: #b3261e; }

  /* ---------- persistent mode banner ---------- */
  .mode-banner {
    background: var(--coral-soft);
    border-bottom: 1px solid #f6d8dc;
    color: #7c2b36;
    padding: 7px 20px;
    font-size: 12.5px;
    text-align: center;
  }
  .mode-banner b { color: var(--coral-dark); }

  /* ---------- layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--right-w);
    gap: 18px;
    max-width: 1440px;
    margin: 0 auto;
    padding: 18px 20px 40px;
    align-items: start;
  }

  /* ---------- left sidebar ---------- */
  .sidebar {
    position: sticky;
    top: 106px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
  }
  .panel h2 {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-bottom: 10px;
  }
  .agent-card {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--coral-soft);
    color: var(--coral-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    flex: none;
  }
  .agent-card .info .name { font-weight: 600; font-size: 13.5px; }
  .agent-card .info .state { font-size: 12px; color: var(--text-muted); }
  .agent-card .info .state.is-active { color: #3f8f52; }

  .pills {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
  }
  .pill {
    padding: 7px 4px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: #fff;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    color: var(--text-muted);
    transition: all .15s;
  }
  .pill:hover { border-color: var(--coral); color: var(--coral); }
  .pill.active {
    background: var(--coral);
    border-color: var(--coral);
    color: #fff;
  }
  .pill .k {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
  }
  .pill .v { display: block; font-size: 10.5px; font-weight: 400; opacity: .85; }

  .side-nav a {
    display: block;
    padding: 7px 10px;
    border-radius: var(--radius-sm);
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
  }
  .side-nav a:hover { background: var(--coral-soft); color: var(--coral-dark); }

  .footnote {
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.6;
    padding: 0 4px;
  }

  /* ---------- center feed ---------- */
  .feed-col { min-width: 0; }

  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .summary .empty { display: none; }
  .metric-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
  }
  .metric-card .label { font-size: 11.5px; color: var(--text-muted); }
  .metric-card .value {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-top: 2px;
  }
  .metric { font-variant-numeric: tabular-nums; }

  .feed-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 10px;
  }
  .feed-head h2 { font-size: 15px; font-weight: 700; }
  .feed-head .muted { font-size: 12px; }

  #feed {
    column-count: 3;
    column-gap: 14px;
  }
  #feed .post-card {
    margin: 0 0 14px;
    break-inside: avoid;
  }

  .post-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    display: flex;
    flex-direction: column;
    text-align: left;
    width: 100%;
  }
  .post-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(60, 40, 40, .08);
  }
  .post-card.selected {
    outline: 2px solid var(--coral);
    outline-offset: -2px;
  }
  .cover {
    width: 100%;
    max-height: 280px;
    object-fit: cover;
    display: block;
    background: #f2efec;
  }
  .post-card .body-wrap { padding: 12px 14px 14px; flex: 1; }
  .post-title {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 6px;
  }
  .post-body {
    font-size: 13px;
    color: var(--text);
    line-height: 1.6;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .byline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .arm {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    letter-spacing: .03em;
    flex: none;
  }
  .arm.T  { background: #eaf1f7; color: #2d5d8a; }
  .arm.TC { background: #f1f0ea; color: #6b6350; }
  .arm.TV { background: var(--coral-soft); color: var(--coral-dark); }

  .tag {
    display: inline-block;
    font-size: 11px;
    color: var(--coral-dark);
    background: var(--coral-soft);
    border-radius: 999px;
    padding: 2px 8px;
    margin: 0 4px 4px 0;
  }
  .muted { color: var(--text-muted); }
  .empty {
    padding: 28px 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
  }

  /* ---------- right detail ---------- */
  .detail-col { min-width: 0; }
  #detail {
    position: relative;
    max-height: calc(100vh - 126px);
    overflow-y: auto;
  }
  #detail img, #detail .detail-img {
    width: 100%;
    max-height: 360px;
    object-fit: contain;
    border-radius: var(--radius-sm);
    background: #f2efec;
    margin-bottom: 10px;
  }
  #detail h3 { font-size: 15px; margin-bottom: 6px; }
  #detail .section-label {
    font-size: 11.5px;
    color: var(--text-muted);
    font-weight: 600;
    margin: 10px 0 4px;
  }
  #close-detail { margin-bottom: 8px; }

  #network ul { list-style: none; }
  #network li {
    padding: 5px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 12.5px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  #network li:last-child { border-bottom: none; }
  .following { color: #3f8f52; font-size: 11.5px; }
  .chip {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 999px;
    background: #f2efec;
    font-size: 12px;
    margin: 0 4px 4px 0;
    color: var(--text);
  }
  .chip.hot { background: var(--coral-soft); color: var(--coral-dark); }

  #timeline { list-style: none; }
  #timeline .event {
    padding: 8px 10px;
    border-left: 3px solid var(--line);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    margin-bottom: 6px;
    font-size: 12.5px;
    background: #faf8f5;
    cursor: pointer;
    width: 100%;
    text-align: left;
  }
  #timeline .event:hover { border-left-color: var(--coral); }
  #timeline .event.selected {
    border-left-color: var(--coral);
    background: var(--coral-soft);
    color: var(--coral-dark);
    font-weight: 600;
  }

  /* ---------- step controls ---------- */
  .stepper {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  .stepper input[type="range"] {
    flex: 1;
    accent-color: var(--coral);
    min-width: 0;
  }
  .stepper .step-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .stepper .step-btn:hover { border-color: var(--coral); color: var(--coral); }
  #step-label {
    font-size: 12px;
    color: var(--text-muted);
    min-width: 52px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .post-card > .byline,
  .post-card > .post-title,
  .post-card > .post-body { margin: 0 12px; margin-top: 6px; }
  .post-card > .byline { margin-top: 10px; }
  .post-card > button { margin-bottom: 10px; }
  #timeline { max-height: 220px; overflow: auto; }
  .pills { flex-wrap: wrap; }
  .context-grid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px; margin-top: 18px; padding-bottom: 80px;
  }
  .context-grid > .panel { min-width: 0; overflow-wrap: anywhere; }
  .context-grid p { margin: 7px 0; line-height: 1.6; }
  .account-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .account-metrics span, .account-metrics strong { display: block; font-variant-numeric: tabular-nums; }
  .order-row { padding: 10px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  #account details { margin-top: 12px; }
  #account { overflow-wrap: anywhere; }
  #institution-panel { min-width: 0; max-width: 100%; margin-bottom: 16px; overflow-wrap: anywhere; }
  #institution-panel .institution-note { font-size: 12px; margin-bottom: 6px; }
  .institution-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
  .institution-decision { min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: 12px; }
  .institution-decision h3 { font-size: 13px; }
  .institution-decision p { margin-top: 5px; }
  .institution-action, .institution-slots { font-weight: 600; }
  .institution-source { overflow-wrap: anywhere; }
  .publication-provenance { max-width: 100%; color: var(--coral-dark); font-size: 11.5px; overflow-wrap: anywhere; }
  .post-card > .publication-provenance { margin: 8px 12px 0; }
  .publication-source { color: var(--text-muted); }
  @media (max-width: 1240px) { .institution-list { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 650px) { .context-grid { grid-template-columns: 1fr; } }
  .stepper {
    position: fixed; bottom: 16px; left: 240px; right: 360px; z-index: 40;
    background: #fff; border: 1px solid #ccc; border-radius: 14px;
    padding: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  #step-label {
    max-width: 170px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-size: 11px;
  }
  @media (max-width: 1000px) {
    .stepper { left: 20px; right: 20px; }
    body { padding-bottom: 84px; }
    .feed p { white-space: pre-wrap; }
    details { white-space: pre-wrap; overflow-wrap: anywhere; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
  .hidden, [hidden] { display: none !important; }

  /* ---------- responsive ---------- */
  @media (max-width: 1240px) {
    #feed { column-count: 2; }
  }
  @media (max-width: 1000px) {
    .layout {
      grid-template-columns: 1fr 1fr;
    }
    .sidebar {
      position: static;
      flex-direction: row;
      flex-wrap: wrap;
      grid-column: 1 / -1;
    }
    .sidebar .panel { flex: 1 1 220px; }
    .sidebar .side-nav, .sidebar .footnote { display: none; }
    .feed-col { grid-column: 1; }
    .detail-col { grid-column: 2; }
    #detail { position: static; max-height: none; }
  }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
    .feed-col, .detail-col { grid-column: 1; }
    #feed { column-count: 1; }
    .topbar { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">FLOW<b>MIRROR</b></span>
    <span class="sub">社会观察室</span>
  </div>
  <div class="spacer"></div>
  <div class="toolbar" role="group" aria-label="模拟控制">
    <label for="mode">模式
      <select id="mode">
<option value="history">历史实验回放</option>
        <option value="demo">脚本策略演练</option>
        <option value="browse">已保存自主浏览轨迹</option>
      </select>
    </label>
    <label for="run">实验
      <select id="run" aria-label="选择实验"></select>
    </label>
    <label for="agent">Agent
      <select id="agent" aria-label="选择 Agent"></select>
    </label>
    <label for="day">日期
      <select id="day" aria-label="选择日期"></select>
    </label>
    <button id="reload" class="btn" type="button">重新加载</button>
  </div>
  <div class="status-bar" aria-live="off">
    <span class="status-dot" aria-hidden="true"></span>
    <span id="status" role="status" aria-live="polite">就绪</span>
  </div>
</header>

<div class="mode-banner" id="mode-note" aria-live="polite">
  当前模式：<b data-mode-label>真实实验回放</b> · 模拟日期 / 非真实市场行情
</div>

<main class="layout">

  <!-- left sidebar -->
  <aside class="sidebar">
    <section class="panel" aria-label="当前 Agent">
      <h2>活跃 Agent</h2>
      <div class="agent-card">
        <div class="avatar" id="avatar" aria-hidden="true">—</div>
        <div class="info">
          <div class="name" id="agent-name">未选择</div>
          <div class="state" id="agent-state">等待加载</div>
        </div>
      </div>
    </section>

    <section class="panel" id="agent-search-panel" aria-label="查找 Agent" hidden>
      <label for="agent-search">查找 Agent</label>
      <input id="agent-search" type="search" placeholder="账号、编号或 T / TC / TV" autocomplete="off">
      <output id="agent-search-count" aria-live="polite"></output>
    </section>

    <section class="panel" aria-label="干预分组">
      <h2>干预分组</h2>
      <div class="pills" role="group" aria-label="内容生成通道">
        <button type="button" class="pill arm T" data-arm="T">
          <span class="k">TEXT</span><span class="v">T</span>
        </button>
        <button type="button" class="pill arm TC" data-arm="TC">
          <span class="k">CAPTION</span><span class="v">TC</span>
        </button>
        <button type="button" class="pill arm TV" data-arm="TV">
          <span class="k">VISION</span><span class="v">TV</span>
        </button>
      </div>
    </section>

    <nav class="panel side-nav" aria-label="观察导航">
      <h2>导航</h2>
      <a href="#feed">帖子流</a>
      <a href="/corpus.html">真实数据素材库</a>
      <a href="/market.html" id="macro-link">宏观市场观察</a>
      <a href="#network">关注关系</a>
      <a href="#market-panel">市场观察</a>
      <a href="#account-panel">账户与订单</a>
      <a href="#timeline-panel">动作时间线</a>
    </nav>

    <p class="footnote">观察者点击不计入 agent 动作；脚本策略不代表真模型结果。</p>
  </aside>

  <!-- center feed -->
  <section class="feed-col" aria-label="帖子信息流">
    <div class="summary" id="summary" aria-label="概览指标">
      <div class="metric-card"><div class="label">可见帖子</div><div class="value metric" id="m-posts">—</div></div>
      <div class="metric-card"><div class="label">Agent 发帖</div><div class="value metric" id="m-agent">—</div></div>
      <div class="metric-card"><div class="label">互动次数</div><div class="value metric" id="m-engagement">—</div></div>
      <div class="metric-card"><div class="label">关注变化</div><div class="value metric" id="m-follow">—</div></div>
    </div>

    <section class="panel" id="institution-panel" aria-label="机构决策" hidden></section>
    <section class="panel" id="behavior-panel" aria-label="会话行为统计" hidden style="margin-bottom:16px;min-width:0"></section>

    <div class="feed-head">
      <h2>当前可见帖子</h2>
      <span class="muted">模拟日期 / 非真实市场行情</span>
    </div>
    <div id="feed" role="list" aria-label="帖子卡片流"></div>
    <div class="context-grid">
      <section class="panel" id="network" aria-label="关注关系">
        <h2>关注关系</h2>
        <ul id="timeline-network" hidden></ul>
        <ul><li class="muted empty">等待加载…</li></ul>
      </section>
      <section class="panel" id="market-panel" aria-label="市场观察" hidden>
        <h2>市场观察</h2>
        <div id="market-data"></div>
      </section>
    </div>
  </section>

  <!-- right detail -->
  <aside class="detail-col">
    <section class="panel" id="detail" aria-label="帖子详情" aria-live="polite">
      <button id="close-detail" class="btn ghost" type="button" hidden>关闭详情</button>
      <div class="empty">点帖子查看素材</div>
    </section>

    <section class="panel" id="account-panel" aria-label="账户信息" style="margin-top:14px">
      <h2>账户</h2>
      <div id="account"><p class="muted">等待加载…</p></div>
    </section>

    <section class="panel" id="timeline-panel" style="margin-top:14px" aria-label="动作时间线">
      <h2>动作时间线</h2>
      <ul id="timeline"></ul>
      <div class="stepper">
        <button id="prev" class="step-btn" type="button" aria-label="上一步">‹</button>
        <input id="step" type="range" min="0" value="0" max="0" aria-label="回放进度">
        <button id="next" class="step-btn" type="button" aria-label="下一步">›</button>
        <button id="play" class="btn ghost" type="button" aria-label="播放">▶</button>
        <span id="step-label">0 / 0</span>
      </div>
    </section>
  </aside>

</main>

<script type="module" src="community.js"></script>
</body>
</html>
