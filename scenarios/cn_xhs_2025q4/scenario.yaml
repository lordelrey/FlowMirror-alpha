# CN scenario: Xiaohongshu fund-market sandbox, 2025Q4 wave (live values).
name: cn_xhs_2025q4
country: CN
platform:
  name: xiaohongshu
  language: zh

population:
  cells_file: data/population/persona_grid_v3.json
  cohort_file: data/population/agents_seed2027.json
  reported_class_field: reported_C
  classes: [C2, C3, C4]

# All four orgs share one masked pool file; the engine filters rows by org.
institutions:
  - name: 广发基金
    pool: data/creatives/cn/content_pool_v1_masked.jsonl
    mode: rule
    policy:
      intent_mix: measured
      cadence: 2
      timing: none
      tactics: []
      targeting: platform
  - name: 鹏华基金
    pool: data/creatives/cn/content_pool_v1_masked.jsonl
    mode: rule
    policy:
      intent_mix: measured
      cadence: 2
      timing: none
      tactics: []
      targeting: platform
  - name: 国联基金
    pool: data/creatives/cn/content_pool_v1_masked.jsonl
    mode: rule
    policy:
      intent_mix: measured
      cadence: 2
      timing: none
      tactics: []
      targeting: platform
  - name: 汇添富基金
    pool: data/creatives/cn/content_pool_v1_masked.jsonl
    mode: rule
    policy:
      intent_mix: measured
      cadence: 2
      timing: none
      tactics: []
      targeting: platform

market:
  nav_file: data/funds/nav_cache.json
  fund_meta_file: data/funds/fund_meta_v1.json
  calendar: cn_trading
  settlement_days: 1
  fees:
    subscribe_rate: 0.012
    redeem_rate: 0.005

regulator:
  plugin: cn_cxr
  options:
    gate_redemptions: false
    qdii_limits: true

channels:
  feed: true
  experience: true
  trend: false
  social: true
  news: true
  direct: false

attention:
  source: guba
  file: data/attention/guba_signal_v1.json

holdout:
  flows_file: data/flows/flow_panel_v2.json
  lead_placebo_quarter: "2025Q3"
