# Public CN-language demo scenario using distributable inputs and synthetic market data.
name: cn_xhs_2025q4
country: CN
platform:
  name: xiaohongshu
  language: zh

population:
  cells_file: data/population/persona_grid_v3.json
  cohort_file: data/population/agents_seed2027.json
  reported_class_field: reported_C
  classes: [C2, C3, C4]

# All four synthetic organisations share one demo pool; the engine filters rows by org.
institutions:
  - name: 示例基金甲
    pool: data/creatives/cn/content_pool_demo.jsonl
    mode: rule
    policy:
      intent_mix: measured
      cadence: 1
      timing: none
      tactics: []
      targeting: platform
  - name: 示例基金乙
    pool: data/creatives/cn/content_pool_demo.jsonl
    mode: rule
    policy:
      intent_mix: measured
      cadence: 1
      timing: none
      tactics: []
      targeting: platform
  - name: 示例基金丙
    pool: data/creatives/cn/content_pool_demo.jsonl
    mode: rule
    policy:
      intent_mix: measured
      cadence: 1
      timing: none
      tactics: []
      targeting: platform
  - name: 示例基金丁
    pool: data/creatives/cn/content_pool_demo.jsonl
    mode: rule
    policy:
      intent_mix: measured
      cadence: 1
      timing: none
      tactics: []
      targeting: platform

market:
  nav_file: data/funds/nav_demo_2025q4.json
  fund_meta_file: data/funds/fund_meta_demo.json
  calendar: cn_trading
  settlement_days: 1
  fees:
    subscribe_rate: 0.012
    redeem_rate: 0.005

regulator:
  plugin: cn_cxr
  options:
    gate_redemptions: false
    qdii_limits: true

channels:
  feed: true
  experience: true
  trend: false
  social: true
  news: true
  direct: false

attention:
  source: guba  # channel shape only; bundled values are synthetic
  file: data/attention/attention_demo.json

holdout:
  flows_file: data/flows/flow_holdout_demo.json
  lead_placebo_quarter: "demo"
