window:
  max_trading_days: 63
# Rule-based policy parameters. Keep them fixed across runs being compared.
agent_policy: llm
null_params:
  p_redeem_gain: 0.06
  p_redeem_loss: 0.03
  redeem_pct: 50
  p_sub_base: 0.05
  chase_slope: 2.0
  sub_pct: 20
  p_sign_mismatch: 0.5
  p_like: 0.15
  p_save: 0.08
  p_follow: 0.02
  p_comment: 0.10
  stance_probs:
    bullish: 0.35
    bearish: 0.30
    watching: 0.35
suitability: true
strategy_mix: measured
strategy_groups:
  push_heavy: []
  edu_heavy: []
  _rule: explicit org list wins; otherwise the named mix applies
ranking: three_source
arm_level: agent
modality_level: agent
modality_arms:
  - "T"
  - "TV"
# modality_run_arm is intentionally absent here; it applies only when
# modality_level is "run", where the engine selects the first configured arm.
# images_root points to a local directory of pre-resized creatives. Null means
# no pixels are attached and the engine reports the degraded TV path. Image
# files are verified against the content pool and must stay outside the repo.
images_root: null
# Which of a note's OWN images the TV arm shows: "first" (the note's first
# image; the intended original behaviour) or "random" (one of the note's own
# images drawn per impression from the agent's deterministic RNG stream, so
# the same agent-day-post picks the same image on replay). Both hold the
# text, the landing fund and the institution constant, which makes "random" a
# clean within-stimulus randomisation for later image-property work. The
# chosen index is logged as img_idx on the imp row.
image_pick: "first"
# Default subscription and redemption fees used when a run does not override them.
fees:
  subscribe_rate: 0.0012
  redeem_rate: 0.005
# CSRC 2017 liquidity rule: redemptions of units held < 7 days pay >= 1.5%.
# Off by default; the counterfactual extra fee is still written to co.st_fee_cf.
# Social graph: off by default; on, comments carry author handles + follower counts,
# agents may follow_users, hot comments rank by followers, and a "what the people you
# follow did yesterday" block appears. Enabling it changes prompt_sha.
social_graph:
  enabled: false
# Institution adaptation: orgs re-weight I1/I2/I3 every period_days from the responses
# their own posts drew. Off by default; the disabled path is byte-identical.
institutions:
  adaptive: false
  period_days: 5
  eta: 0.5
  floor: 0.05
# Seeded social proof: plus posts show likes+k on their first display day; off is byte-identical.
heat_seed:
  enabled: false
  k: 10
  p_treat: 0.5
  focus_fund: null
regulation:
  short_term_redemption:
    enabled: false
    days: 7
    min_fee_rate: 0.015
    disclose: false
p_image: 0.5
climate_weighting: true
memory: true
social: true
channels:
  feed: true
  experience: true
  trend: false
  social: true
  news: true
  direct: false
posts_per_org_per_day: 2
no_repeat_days: 10
feed:
  K: 6
  slots:
    follow: 2
    fit: 2
    trending: 2
  w_trust: 1.0
  w_fit: 1.0
  w_heat: 1.0
  w_soc: 0.5
  # Weight on the per-fund attention stock. Raising it together with
  # dynamics.beta_guba enables the external-attention channel end to end.
  w_att: 0.0
  # feed.fit() adjustment bands: narrow is the core-type term, wide is the
  # risk-latency term on an I2 post.
  fit_band_narrow: 0.15
  fit_band_wide: 0.25
  eps: 0.05
  gamma: 1.8
  # The margin |bullish-bearish|/total must clear before a post's comment
  # climate is called a majority.
  climate_margin: 0.16666666666666666
p_active: 1.0
memory_days: 5
reflection_every_days: 5
llm:
  model: glm-4.6v
  text_model: glm-4.6v
  workers: 4
  max_attempts: 3
  decision_failure_halt: 0.02
  # The halt compares a RATE; below this many decisions the rate is noise (1/40 = 2.5%).
  decision_failure_min_calls: 100
  # max_provider_attempts is the HTTP retry budget inside call_glm. It differs
  # from llm.max_attempts above, which controls whole-response re-asks.
  temperature: 0.3
  max_provider_attempts: 5
  # Cap (seconds) on any single 429/RATE_LIMIT backoff sleep inside call_glm.
  rate_limit_cap_s: 120
  # Cap (seconds) on cumulative rate-limit waits per request before that attempt counts as failed.
  rate_limit_max_wait_s: 600
mock_options:
  force_c2_r4_click: false
  malformed_rate: 0.0
# Belief, familiarity, affinity, and attention dynamics.
dynamics:
  # Exposure decay per day for the familiarity stock.
  fam_decay: 0.2
  # loop.py:~770: the familiarity/affinity stock at which an org reaches
  # exposure level 1 (level 2 is reserved for an explicit follow).
  fam_threshold: 1.0
  # Organisation-affinity adstock retention.
  lambda_trust: 0.9
  # Attention carries its own retention:
  # att_t = lambda_attention * att_{t-1} + exposure + beta_guba * z_guba.
  lambda_attention: 0.8
  # Coefficient on the external abnormal-volume signal. Zero disables its
  # contribution while preserving the rest of the attention pipeline.
  beta_guba: 0.0
# Monthly DCA ticket as a share of cash with an absolute floor.
dca:
  pct: 0.02
  min_ticket: 100.0
# How an agent's opening holding cost is drawn. "lookback" samples a prior
# trading date; "target" draws toward a configured opening P&L distribution.
initial_pnl:
  mode: lookback
  lookback_days_min: 60
  lookback_days_max: 250
  # Target mode requires an explicit share_at_loss; no implicit target is used.
  tolerance: 0.02
# Optional benchmark behind the view's index_5d. Null omits the market line.
# User-supplied proxy data must be labelled as a proxy, and only returns are shown.
market:
  benchmark_path: null
  benchmark_label: null
